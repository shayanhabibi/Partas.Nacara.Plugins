name: ci.yml
on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.fs'
      - 'src/**/*.fsproj'
      - '!site/**/*.*'
      - '!build.fsx'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      # The theme's BundleTheme target runs esbuild through `npx --no-install`, which
      # resolves it from node_modules and refuses to fetch anything. Without this the
      # build fails on the first theme project.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install JavaScript tooling
        run: npm ci
      - name: Run CI
        run: dotnet fsi build.fsx -- publish --nuget-key ${{ secrets.NUGET_KEY }}
