name: ci.yml
on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.fs'
      - 'src/**/*.fsproj'
      - '!site/**/*.*'
      - '!build.fsx'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Run CI
        run: dotnet fsi build.fsx -- publish --nuget-key ${{ secrets.NUGET_KEY }}
